<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Brew & Bite</title><link rel="stylesheet" href="css/style.css"></head><body data-page=""><header class="navbar" id="site-nav"></header><section class="page-head"><div class="container"><h1>Checkout</h1><p>Complete your order details. Payment is demo-only.</p></div></section><section class="section"><div class="container form-card"><div id="confirmation"></div><form id="checkoutForm"><div id="checkoutMsg" class="alert error" hidden></div><div class="form-grid"><div class="form-group"><label>Full Name</label><input class="form-control" name="name"></div><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email"></div><div class="form-group"><label>Phone</label><input class="form-control" name="phone"></div><div class="form-group"><label>Payment Method</label><select class="form-control" name="payment"><option value="">Choose</option><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select></div><div class="form-group full"><label>Address</label><textarea class="form-control" name="address" rows="3"></textarea></div></div><div class="summary" style="position:static;margin-top:20px"><div class="summary-line"><span>Subtotal</span><b id="coSubtotal">₹ 0</b></div><div class="summary-line"><span>Tax</span><b id="coTax">₹ 0</b></div><div class="summary-line summary-total"><span>Total</span><b id="coTotal">₹ 0</b></div></div><button class="btn btn-primary" style="width:100%;margin-top:15px">Place Order</button></form></div></section><footer class="footer" id="site-footer"></footer><div class="toast" id="toast"></div><script src="js/main.js"></script><script src="js/auth.js"></script><script src="js/checkout.js"></script></body></html>
