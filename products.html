<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Brew & Bite Admin</title><link rel="stylesheet" href="../css/style.css"></head><body class="admin-shell"><header class="admin-top" id="adminNav"></header><main class="section"><div class="container"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div><h1 style="color:var(--brown)">Product Management</h1><p class="muted">Add, edit, delete and hide products.</p></div><button class="btn btn-primary" id="addProductBtn">+ Add Product</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Availability</th><th>Actions</th></tr></thead><tbody id="adminProducts"></tbody></table></div></div></main><div class="modal" id="productModal"><div class="modal-box"><h2>Edit Product</h2><form id="productForm"><input type="hidden" id="productId"><div class="form-grid"><div class="form-group"><label>Name</label><input id="pName" class="form-control" required></div><div class="form-group"><label>Category</label><select id="pCategory" class="form-control"><option>Coffee</option><option>Tea</option><option>Cold Drinks</option><option>Snacks</option><option>Desserts</option><option>Breakfast</option></select></div><div class="form-group"><label>Price</label><input id="pPrice" type="number" class="form-control" required></div><div class="form-group"><label>Available</label><input id="pAvailable" type="checkbox" checked></div><div class="form-group full"><label>Description</label><textarea id="pDesc" class="form-control" rows="3"></textarea></div></div><button class="btn btn-primary">Save</button><button type="button" class="btn btn-light" id="closeModal">Cancel</button></form></div></div><div class="toast" id="toast"></div><script src="../js/main.js"></script><script src="../js/admin.js"></script></body></html>
