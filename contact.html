<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | Brew & Bite</title><link rel="stylesheet" href="css/style.css"></head><body data-page=""><header class="navbar" id="site-nav"></header><section class="page-head"><div class="container"><h1>Contact Us</h1><p>Have a question? Send us a demo message.</p></div></section><section class="section"><div class="container two-col"><div class="form-card" style="max-width:none"><form id="contactForm"><div id="contactMsg" class="alert success" hidden></div><div class="form-group"><label>Name</label><input class="form-control" required></div><div class="form-group"><label>Email</label><input class="form-control" type="email" required></div><div class="form-group"><label>Message</label><textarea class="form-control" rows="5" required></textarea></div><button class="btn btn-primary" style="margin-top:15px">Send Message</button></form></div><div><h2 style="color:var(--brown)">Visit Us</h2><p class="muted">📍 Rajkot, Gujarat, India</p><p class="muted">☎ +91 98765 43210</p><p class="muted">✉ hello@brewandbite.demo</p><h3 style="color:var(--brown)">Opening Hours</h3><p class="muted">Monday – Sunday: 8:00 AM – 10:00 PM</p></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();const x=document.getElementById('contactMsg');x.hidden=false;x.textContent='Thank you! Your demo message has been submitted.';e.target.reset()}));</script><footer class="footer" id="site-footer"></footer><div class="toast" id="toast"></div><script src="js/main.js"></script></body></html>
