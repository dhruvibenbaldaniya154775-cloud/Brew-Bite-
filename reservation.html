<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation | Brew & Bite</title><link rel="stylesheet" href="css/style.css"></head><body data-page="reservation"><header class="navbar" id="site-nav"></header><section class="page-head"><div class="container"><h1>Table Reservation</h1><p>Choose your date, time and table preference.</p></div></section><section class="section"><div class="form-card"><form id="reservationForm"><div id="reservationMsg" class="alert error" hidden></div><div class="form-grid"><div class="form-group"><label>Customer Name *</label><input class="form-control" name="name"></div><div class="form-group"><label>Email *</label><input class="form-control" name="email" type="email"></div><div class="form-group"><label>Phone *</label><input class="form-control" name="phone"></div><div class="form-group"><label>Date *</label><input class="form-control" name="date" type="date"></div><div class="form-group"><label>Time *</label><input class="form-control" name="time" type="time"></div><div class="form-group"><label>Guests *</label><input class="form-control" name="guests" type="number" min="1" max="12"></div><div class="form-group"><label>Table Preference</label><select class="form-control" name="table"><option>Any Table</option><option>Window Table</option><option>2-Seater</option><option>4-Seater</option></select></div><div class="form-group"><label>Special Request</label><input class="form-control" name="request"></div></div><button class="btn btn-primary" style="margin-top:15px">Confirm Reservation</button></form></div></section><footer class="footer" id="site-footer"></footer><div class="toast" id="toast"></div><script src="js/main.js"></script><script src="js/auth.js"></script><script src="js/reservation.js"></script></body></html>
